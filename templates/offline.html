<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>オフライン | Life management</title>
  <style>
    /* オフライン時はCDNが使えないため、スタイルはすべてインラインで完結させる */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      box-sizing: border-box;
      background-color: #f5f6f8;
      color: #191c21;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .offline-card {
      max-width: 420px;
      text-align: center;
      border: 1px solid #e3e6ea;
      border-radius: 12px;
      background: #fff;
      padding: 32px 24px;
    }
    .offline-icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #6c757d; font-size: 0.9rem; line-height: 1.6; }
    button {
      background-color: #33518e;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      padding: 6px 12px;
      min-height: 36px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background-color: #2a4376; }
    button:focus-visible { outline: 2px solid #33518e; outline-offset: 3px; }
    @media (pointer: coarse) { button { min-height: 40px; } }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">📡</div>
    <h1>オフラインです</h1>
    <p>インターネット接続がありません。<br>接続を確認してから、もう一度お試しください。</p>
    <button type="button" onclick="location.reload()">再読み込み</button>
  </div>
</body>
</html>
