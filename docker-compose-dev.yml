# $ docker-compose -f docker-compose-dev.yml build
# $ docker-compose -f docker-compose-dev.yml up -d


services:
  db:
    image: postgres:16
    restart: ${CONTAINER_RESTART_POLICY:-no}
    env_file: ${POSTGRES_ENV_FILE:-db.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=10", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB", "-c", "huge_pages=off"]
     # メモリ設定の追加
     # lightsailのメモリ設定は1GBのため、メモリ使用量を軽減する

  gunicorn:
    build: .
    image: gunicorn:20.1.0
    container_name: gunicorn
    restart: ${CONTAINER_RESTART_POLICY:-no}
    volumes:
      - .:/code/
      - gunicorn:/var/run/gunicorn
    env_file: secret.env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-project.settings.development}
      # .env の MAINTENANCE_MODE を渡す。切替は scripts/maintenance-mode.sh（restart では反映されない）
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-False}
    stdin_open: true
    tty: true
    depends_on:
      - db

  nginx:
    image: nginx:1.30.6@sha256:a7675fcee220f59b4a99f7098c06a0d5d999c2c0ee37c0211efb780536e5cb20
    container_name: nginx
    restart: ${CONTAINER_RESTART_POLICY:-no}
    depends_on:
      - gunicorn
    ports:
      - "${NGINX_PORT:-8000}:${NGINX_PORT:-8000}"
    volumes:
      - ${NGINX_CONFIG_FILE:-./gunicorn.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_SECURITY_DIR:-./nginx/security}:/etc/nginx/security:ro
      - ${NGINX_CERTIFICATE_DIR:-./nginx/certificates}:/etc/nginx/certificates:ro
      - ./static_root:/var/www/static
      - ./media:/var/www/media
      - gunicorn:/var/run/gunicorn

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: cron
    volumes:
      - .:/code/
    env_file: secret.env
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-project.settings.development}
    restart: unless-stopped
    depends_on:
      - db

volumes:
  postgres_data:
  gunicorn:
    driver: local
