# 有効化前に scripts/prepare-origin-security.py とTLS証明書を準備する。
# 必須includeや証明書がない場合は起動を失敗させ、制限なしへフォールバックしない。
upstream gunicorn-django {
    server unix:///var/run/gunicorn/gunicorn.sock;
}

include /etc/nginx/security/cloudfront-realip.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $cloudfront_peer {
    default 0;
    include /etc/nginx/security/cloudfront-peers.conf;
}
map_hash_bucket_size 128;
map $http_x_carbohydratepro_origin $origin_verified {
    default 0;
    include /etc/nginx/security/origin-token.map;
}
map $uri $static_cache_control {
    default "no-cache";
    "~^/static/.+\.[0-9a-f]{12}\.[^/]+$" "public, max-age=31536000, immutable";
}
# 秘密ヘッダー、Cookie、クエリ文字列は記録しない。
log_format origin_access '$remote_addr peer=$realip_remote_addr [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name carbohydratepro.com lightsail.carbohydratepro.com;
    server_tokens off;
    ssl_certificate /etc/nginx/certificates/live/lightsail.carbohydratepro.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificates/live/lightsail.carbohydratepro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log /var/log/nginx/access.log origin_access;
    client_max_body_size 100M;

    if ($cloudfront_peer = 0) { return 403; }
    if ($origin_verified = 0) { return 403; }

    location / {
        try_files $uri @gunicorn;
    }
    location /static/ {
        alias /var/www/static/;
        add_header Cache-Control $static_cache_control;
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    }
    location /media/ {
        alias /var/www/media/;
    }
    location @gunicorn {
        proxy_pass http://gunicorn-django;
        proxy_set_header Host $host;
        # 検証済みの接続元IPだけをDjangoへ渡し、任意の転送ヘッダーを残さない。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Carbohydratepro-Origin "";
    }
}
